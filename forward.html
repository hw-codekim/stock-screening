<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포워드실적</title>
<link rel="stylesheet" href="assets/style.css?v=2">
<link rel="stylesheet" href="assets/forward.css">
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <div>
            <h1>포워드실적</h1>
            <div class="sub">섹터별 컨센서스 · PER 26E/27E</div>
        </div>
        <nav class="site-nav">
            <a href="index.html">TODAY</a>
            <a href="q2.html">2Q26실적</a>
            <a href="forward.html" class="active">포워드실적</a>
            <a href="us-charts.html">미장</a>
        </nav>
    </div>
    <div class="visitor-badge">
        <span class="dot"></span>방문자 <span id="visitor-count">-</span>명
        <span class="visitor-sep">·</span>
        <a class="hits-badge" href="https://hits.sh/hw-codekim.github.io/stock-screening/" target="_blank" rel="noopener">
            <img src="https://hits.sh/hw-codekim.github.io/stock-screening/.svg?style=flat-square&label=hits.sh&color=2F5FA3&labelColor=14315C" alt="hits.sh 방문자 카운터">
        </a>
    </div>
</header>

<div class="container">
    <div class="page-note">
        <div class="page-note-kicker" id="fw-generated-at"></div>
        <div class="page-note-title">포워드실적 이용 가이드</div>
    </div>

    <div class="search-bar">
        <select id="fw-market-filter">
            <option value="">전체 시장</option>
            <option value="KOSPI">코스피</option>
            <option value="KOSDAQ">코스닥</option>
        </select>
        <select id="fw-large-filter">
            <option value="">전체 대분류</option>
        </select>
        <select id="fw-mid-filter">
            <option value="">전체 중분류</option>
        </select>
        <select id="fw-metric-filter">
            <option value="revenue">매출액</option>
            <option value="op_income" selected>영업이익</option>
            <option value="net_income">순이익</option>
            <option value="eps">EPS</option>
        </select>
        <select id="fw-quick-filter">
            <option value="">빠른 필터 없음</option>
            <option value="opm_qoq5">전분기대비 OPM +5%p 이상</option>
            <option value="opm_yoy5">전년동기대비 OPM +5%p 이상</option>
            <option value="opm20">최근분기 OPM 20% 이상</option>
            <option value="rev_yoy50">최근분기 매출 YoY 50% 이상</option>
            <option value="per26_10">26년E PER 10배 이하</option>
            <option value="per27_10">27년E PER 10배 이하</option>
            <option value="div4">배당률 4% 이상</option>
            <option value="rev_up26">26년E 컨센서스 상향(선택 지표)</option>
            <option value="rev_up27">27년E 컨센서스 상향(선택 지표)</option>
        </select>
        <input type="text" id="fw-stock-search" placeholder="종목명 검색">
        <button class="header-btn" id="fw-csv-btn" style="font-size:0.8rem;padding:6px 14px;">📥 엑셀 다운로드</button>
    </div>

    <div class="fw-count-line" id="fw-count-line">불러오는 중...</div>

    <div class="fw-table-wrap" id="fw-table-wrap">
        <table class="fw-table">
            <thead id="fw-thead"></thead>
            <tbody id="fw-tbody">
                <tr><td style="text-align:center;color:#aaa;padding:20px;">불러오는 중...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="site-footer">데이터는 매 영업일 장마감 후 갱신됩니다.</div>
</div>

<button id="scroll-top-btn" class="scroll-top-btn" title="맨 위로">▲ 최상위</button>

<script data-goatcounter="https://stock-screening.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="assets/forward.js"></script>
</body>
</html>
