<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHART - 종목 차트</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/chart.css">
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <div>
            <h1>CHART</h1>
            <div class="sub">종목 캔들차트</div>
        </div>
        <nav class="site-nav">
            <a href="index.html">TODAY</a>
            <a href="q2.html">2Q26실적</a>
            <a href="forward.html">포워드실적</a>
            <a href="us-charts.html">미장</a>
            <a href="chart.html" class="active">CHART</a>
        </nav>
    </div>
</header>

<div class="container">

<div class="search-bar">
    <input type="text" id="stockNameInput"
        placeholder="종목명 입력 (예: 삼성전자)"
        onkeydown="if(event.key==='Enter') searchChart()" />
    <button onclick="searchChart()">조회</button>
    <button class="anno-btn" onclick="searchIndex('코스피')">코스피</button>
    <button class="anno-btn" onclick="searchIndex('코스닥')">코스닥</button>
</div>

<div class="mdd-box" id="universe-box">
    <div class="mdd-box-header" style="cursor:pointer;" onclick="toggleUniverseList()">
        <span class="mdd-box-title">
            <span id="universe-title">📋 코스피200 · 코스닥150 (시총 상위)</span>
            <span style="font-size:11px;color:#aaa;font-weight:400;">↓/↑ 키로 이동</span>
            <a href="chart.html" id="universe-back" class="mdd-box-back" style="display:none;" onclick="event.stopPropagation();">← 전체 목록</a>
        </span>
        <span class="mdd-box-count" id="universe-count">로딩 중...</span>
    </div>
    <div id="universe-list-wrap" style="display:none;">
        <div class="anno-toolbar" id="uni-tabs" style="margin-top:4px;">
            <button class="anno-btn active" id="uni-tab-kospi" onclick="switchUniverseTab('kospi')">코스피200</button>
            <button class="anno-btn" id="uni-tab-kosdaq" onclick="switchUniverseTab('kosdaq')">코스닥150</button>
        </div>
        <div id="universe-list" class="mdd-list universe-list"></div>
    </div>
</div>

<div id="chart-result"></div>

</div>

<button id="scroll-top-btn" class="scroll-top-btn" title="맨 위로">▲ 최상위</button>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="assets/chart.js"></script>
<script>
document.getElementById('scroll-top-btn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
window.addEventListener('scroll', () => {
    document.getElementById('scroll-top-btn').classList.toggle('visible', window.scrollY > 400);
});
</script>
</body>
</html>
