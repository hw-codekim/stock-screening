<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소통방</title>
<link rel="stylesheet" href="assets/style.css?v=2">
<link rel="stylesheet" href="assets/board.css?v=1">
</head>
<body>

<header class="site-header">
    <div class="header-left">
        <div>
            <h1>소통방</h1>
            <div class="sub">자유롭게 의견을 남겨주세요</div>
        </div>
        <nav class="site-nav">
            <a href="news.html">주요뉴스</a>
            <a href="index.html">TODAY</a>
            <a href="q2.html">2Q26실적</a>
            <a href="forward.html">포워드실적</a>
            <a href="us-charts.html">미장</a>
            <a href="cashflow.html">현금흐름</a>
            <a href="trade-value.html">거래대금</a>
            <a href="board.html" class="active">소통방</a>
        </nav>
    </div>
    <div class="visitor-badge">
        <span class="dot"></span>방문자 <span id="visitor-count">-</span>명
        <span class="visitor-sep">·</span>
        <a class="hits-badge" href="https://hits.sh/hw-codekim.github.io/stock-screening/" target="_blank" rel="noopener">
            <img src="https://hits.sh/hw-codekim.github.io/stock-screening/.svg?style=flat-square&label=hits.sh&color=2F5FA3&labelColor=14315C" alt="hits.sh 방문자 카운터">
        </a>
    </div>
</header>

<div class="container">
    <div class="page-note">
        <div class="page-note-kicker">자유게시판</div>
        <div class="page-note-title">소통방 이용 가이드</div>
        <div class="page-note-body">
            ☞ 누구나 자유롭게 글을 읽고 쓸 수 있습니다<br>
            ☞ 비방·광고·불법성 게시물은 예고 없이 삭제될 수 있습니다
        </div>
    </div>

    <div class="board-toolbar">
        <div class="summary-line" id="summary-line">불러오는 중...</div>
        <button type="button" id="board-write-btn">✏ 작성하기</button>
    </div>

    <div class="board-form" id="board-form" hidden>
        <input type="text" id="board-name" placeholder="이름 (최대 30자)" maxlength="30">
        <textarea id="board-message" placeholder="내용을 입력하세요 (최대 1000자)" maxlength="1000" rows="4"></textarea>
        <input type="text" id="board-website" name="website" class="board-honeypot" tabindex="-1" autocomplete="off">
        <div class="board-form-actions">
            <button type="button" id="board-cancel-btn">취소</button>
            <button type="button" id="board-submit-btn">등록</button>
        </div>
    </div>

    <div class="board-list" id="board-list">
        <p class="placeholder">불러오는 중...</p>
    </div>

    <div class="site-footer">글은 즉시 공개 게시됩니다.</div>
</div>

<button id="scroll-top-btn" class="scroll-top-btn" title="맨 위로">▲ 최상위</button>

<script data-goatcounter="https://stock-screening.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="assets/board.js?v=1"></script>
</body>
</html>
