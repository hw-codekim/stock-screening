<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실적 스크리닝</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
    <div>
        <h1>실적 스크리닝</h1>
        <div class="sub">국내 상장사 분기 실적 발표 현황</div>
    </div>
    <div class="visitor-badge">
        <span class="dot"></span>방문자 <span id="visitor-count">-</span>명
        <span class="visitor-sep">·</span>
        <a class="hits-badge" href="https://hits.sh/hw-codekim.github.io/stock-screening/" target="_blank" rel="noopener">
            <img src="https://hits.sh/hw-codekim.github.io/stock-screening/.svg?style=flat-square&label=hits.sh&color=2F5FA3&labelColor=14315C" alt="hits.sh 방문자 카운터">
        </a>
    </div>
</header>

<div class="container">
    <div class="search-bar">
        <select id="market-filter">
            <option value="">전체 시장</option>
            <option value="코스피">코스피</option>
            <option value="코스닥">코스닥</option>
        </select>
        <select id="large-filter">
            <option value="">전체 대분류</option>
        </select>
        <select id="mid-filter">
            <option value="">전체 중분류</option>
        </select>
        <select id="quick-filter">
            <option value="">빠른 필터 없음</option>
            <option value="newtoday">신규 등록 (금일 실적 발표)</option>
            <option value="op100">영업이익 YoY 100% 이상</option>
            <option value="opgtrev">영업이익 YoY &gt; 매출 YoY</option>
            <option value="opm10">OPM 10% 이상</option>
            <option value="opm20">OPM 20% 이상</option>
            <option value="mdd10">MDD -10% 이내</option>
            <option value="price50">7/30일 이후 50% 이상</option>
            <option value="topgain">당일 급등 상위 30</option>
        </select>
        <input type="text" id="stock-search" placeholder="종목명 또는 코드 검색">
    </div>
    <label class="unreported-toggle">
        <input type="checkbox" id="unreported-toggle"> 실적 미발표 기업 포함
        <span class="unreported-note">( 종목별 그래프와 차트는 체크 해제했을 경우만 가능)</span>
    </label>

    <div class="summary-line" id="summary-line">불러오는 중...</div>

    <div class="index-box">
        <div class="index-scroll">
            <table class="index-table">
                <thead>
                    <tr>
                        <th>지수</th>
                        <th>당일등락</th>
                        <th>1주</th>
                        <th>1개월</th>
                        <th>3개월</th>
                        <th>YTD</th>
                        <th>52주 신고</th>
                        <th>52주 신저</th>
                        <th>현재위치</th>
                        <th>지수MDD</th>
                        <th>ADR</th>
                        <th>상승</th>
                        <th>보합</th>
                        <th>하락</th>
                    </tr>
                </thead>
                <tbody id="index-summary-body">
                    <tr><td colspan="14" class="index-loading">불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="list-wrap">
        <div class="sr-header">
            <span class="sr-arrow"></span>
            <span class="sr-name">종목명</span>
            <span class="sr-sector">섹터</span>
            <span class="sr-market">시장</span>
            <span class="sr-mktcap">시가총액</span>
            <span class="sr-num">매출</span>
            <span class="sr-yoy">YoY</span>
            <span class="sr-num">영업이익</span>
            <span class="sr-yoy">YoY</span>
            <span class="sr-opm">OPM</span>
            <span class="sr-price">현재가</span>
            <span class="sr-daychg" id="daychg-header">최근등락</span>
            <span class="sr-chg" id="chg-header">7/30일 이후</span>
            <span class="sr-mdd">MDD</span>
        </div>
        <div id="list-body">
            <p class="placeholder">불러오는 중...</p>
        </div>
    </div>

    <div class="site-footer">데이터는 매 영업일 장마감 후 갱신됩니다.</div>
</div>

<button id="scroll-top-btn" class="scroll-top-btn" title="맨 위로">▲ 최상위</button>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script data-goatcounter="https://stock-screening.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="assets/common.js"></script>
</body>
</html>
